services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_API_URL is baked into the JS bundle at build time.
      # Set it in your .env or pass it via the shell before running compose.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env, e.g. https://api.your-domain.com/api/v1}
    image: realtron-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
